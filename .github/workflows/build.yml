name: Build Windows Setup
on:
  push:
    tags:
      - 'v*' # 🔥 关键：只有推送 v 开头的 tag 时才触发，避免每次 push 都发版
  workflow_dispatch:

# 🔥 必须加这个，否则 GitHub Actions 没有权限向 Releases 写文件
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '18' }
      - run: npm install
      - run: npm run build
      - run: choco install innosetup -y
      - run: iscc setup.iss
      
      # 🔥 自动发布到 Releases
      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/WHITE_ModLauncher_Setup.exe
