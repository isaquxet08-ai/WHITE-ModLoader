name: Build Android APK
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'zulu', java-version: '17' }
      - run: |
          sudo apt-get install -y apktool
          echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0"
          echo "${ANDROID_HOME}/build-tools/34.0.0" >> $GITHUB_PATH
      - run: |
          # ⚠️ 记得把下面换成你刚刚复制的真实 APK 链接
          wget "你的真实APK链接" -O original.apk
          apktool d original.apk -o dec
          cp android/mod-loader.js dec/assets/game/app/
          cp android/console.js dec/assets/game/app/
          sed -i 's|</body>|<script src="app/mod-loader.js"></script>\n<script src="app/console.js"></script>\n</body>|g' dec/assets/game/index.html
          apktool b dec -o raw.apk
          keytool -genkey -v -keystore key.keystore -alias a -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Mod" 2>/dev/null
          zipalign -v 4 raw.apk aligned.apk
          apksigner sign --ks key.keystore --ks-pass pass:123456 --out WHITE_Modded.apk aligned.apk
          
      # 🔥 自动发布到 Releases
      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: WHITE_Modded.apk
